[package]
name = "coprocessor"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "1.0", features = ["full", "node-bindings"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
hex = "0.4"
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
futures = "0.3"
once_cell = "1.19"
# TFHE-rs with integer FHE types (FheUint64, FheBool, etc.)
# The "integer" feature enables high-level FHE integer types
tfhe = { version = "1.4.3", features = ["integer"] }
base64 = "0.22.1"
bincode = "1.3"
reqwest = { version = "0.12", features = ["json"] }
